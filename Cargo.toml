[package]
name = "aerocache"
version = "0.1.0"
edition = "2024"
authors = ["Zohran"]
description = "Ultra-fast, sharded, concurrent in-memory cache with zero-copy lookups, TTL, and enterprise telemetry."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Saltborn000/Aerocache"
homepage = "https://github.com/Saltborn000/Aerocache"
documentation = "https://docs.rs/aerocache"
keywords = ["cache", "concurrency", "lock-free", "sharded", "performance"]
categories = ["caching", "concurrency", "data-structures"]

[features]
default = []
serde = ["dep:serde"]

[dependencies]
ahash = "0.8.12"
parking_lot = "0.12.5"
serde = { version = "1.0.229", optional = true, features = ["derive"] }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "cache_throughput"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

